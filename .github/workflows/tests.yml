name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - run: TMUX_TEST_BINARY=$(command -v tmux) python -m unittest discover -v
      - run: node --check toolbelt/web/app.js
      - run: python scripts/build_iterm_script.py && git diff --exit-code -- dist/tmux_toolbelt.py
